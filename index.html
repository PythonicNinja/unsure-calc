<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>unSure Calculator</title>
        <meta
            name="description"
            content="Probabilistic calculator: type ranges with ~ (7~10 * 17~23) or currency expressions (120usd + 50eur to pln) to get exact bounds, a simulated 5%-95% range and a histogram."
        />
        <link rel="canonical" href="https://calc.pythonic.ninja/" />
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23e0b973'/%3E%3Ctext x='32' y='47' font-size='44' font-family='Georgia,serif' text-anchor='middle' fill='%233a2c13'%3E~%3C/text%3E%3C/svg%3E"
        />

        <!-- Self-hosted fonts (OFL, see fonts/): preloaded so they land before first paint -->
        <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/manrope-v20-latin.woff2" />
        <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/dm-serif-display-v17-latin.woff2" />

        <!-- Deferred but render-blocking: the first frame already contains the computed result (no pop-in, LCP = FCP) -->
        <script src="core/calc-core.js" defer blocking="render"></script>
        <script src="main.js" defer blocking="render"></script>

        <style>
            @font-face {
                font-family: "Manrope";
                font-style: normal;
                font-weight: 400 800;
                font-display: swap;
                src: url(fonts/manrope-v20-latin.woff2) format("woff2");
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            @font-face {
                font-family: "DM Serif Display";
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url(fonts/dm-serif-display-v17-latin.woff2) format("woff2");
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            /* Metric-matched local fallbacks (fontTools-derived) so a late font swap does not move anything */
            @font-face {
                font-family: "Manrope Fallback";
                src: local("Arial");
                size-adjust: 100.576%;
                ascent-override: 105.99%;
                descent-override: 29.828%;
                line-gap-override: 0%;
            }
            @font-face {
                font-family: "DM Serif Display Fallback";
                src: local("Georgia");
                size-adjust: 101.266%;
                ascent-override: 102.305%;
                descent-override: 33.081%;
                line-gap-override: 0%;
            }

            :root {
                --gold: #bfa36f;
                --gold-light: #e0b973;
                --cream: #fff6f0;
                --cream-dark: #f7e7ce;
                --ink: #3a2c13;
                --muted: #6b7280;
                --label: #5b574f;
                --unit: #7f6127;
                --op: #6b5d45;
                --line: rgba(191, 163, 111, 0.35);
                --mark: #f6e2b8;
                --band: #8a6420;
                --tail: #c9a862;
                --axis: rgba(58, 44, 19, 0.28);
                --error: #b91c1c;
                --sans: "Manrope", "Manrope Fallback", Arial, sans-serif;
                --serif: "DM Serif Display", "DM Serif Display Fallback", Georgia, serif;
                --mono: "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
                --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            }

            *, *::before, *::after { box-sizing: border-box; }
            html { line-height: 1.5; -webkit-text-size-adjust: 100%; }
            body, h1, p { margin: 0; }
            a { color: inherit; }
            button { background: none; border: 0; font: inherit; color: inherit; cursor: pointer; }
            code {
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
                font-size: 1em;
            }

            body {
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: flex-start;
                padding: clamp(1rem, 6vh, 4rem) 1rem 1rem;
                font-family: var(--sans);
                color: #1f2937;
                letter-spacing: 0.01em;
                background: linear-gradient(135deg, var(--cream-dark) 0%, var(--cream) 100%);
            }
            .card {
                width: 100%;
                max-width: 56rem;
                padding: 1rem;
                background: #fff;
                border-radius: 0.5rem;
                box-shadow: var(--shadow-md);
            }
            h1 {
                font-family: var(--serif);
                font-size: 1.875rem;
                line-height: 2.25rem;
                font-weight: 700;
                color: #374151;
                text-align: center;
                letter-spacing: 0.025em;
                text-shadow: 0 2px 8px var(--cream), 0 1px 0 var(--gold);
                margin-bottom: 1.5rem;
                cursor: pointer;
            }
            .input-row {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                margin-bottom: 1.5rem;
            }
            #expression {
                flex: 1 1 auto;
                min-width: 0;
                padding: 1.15rem 1.5rem;
                border: 2px solid var(--gold);
                border-radius: 10px;
                background: var(--cream);
                font-family: var(--sans);
                font-size: 1.18rem;
                line-height: 1.625;
                font-weight: 500;
                letter-spacing: 0.05em;
                color: var(--ink);
                box-shadow: 0 1.5px 6px 0 rgba(191, 163, 111, 0.08);
            }
            #expression::placeholder { color: var(--muted); opacity: 1; }
            #expression:focus {
                outline: none;
                border-color: var(--gold-light);
                box-shadow: 0 0 0 2px #f2e6d9, 0 1.5px 6px 0 #e0b97333;
            }
            #calculateBtn {
                flex: 0 0 50px;
                padding: 1rem 0;
                background: var(--gold-light);
                color: var(--ink);
                font-family: var(--sans);
                font-weight: 700;
                font-size: 1.25rem;
                line-height: 1.75rem;
                border-radius: 10px 0.75rem 0.75rem 10px;
                box-shadow: var(--shadow-md);
            }
            #calculateBtn:hover { background: var(--gold); }
            #calculateBtn:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 2px; }

            .hint {
                margin-top: 0.5rem;
                font-size: 0.75rem;
                line-height: 1rem;
                min-height: 1rem;
                color: var(--muted);
                text-align: center;
            }
            .result + .hint { margin-top: 1rem; }
            .hint a { color: #7f6127; text-decoration: underline; }
            .hint a:hover { color: var(--gold); }

            .result {
                margin-top: 0;
                padding: 1.5rem 1.2rem 1.2rem;
                min-height: 4em;
                overflow-x: auto;
                border: 2px solid var(--gold);
                border-radius: 10px;
                background: linear-gradient(135deg, var(--cream) 80%, var(--cream-dark) 100%);
                color: var(--ink);
                font-family: var(--mono);
                font-size: 0.875rem;
                line-height: 1.625;
                letter-spacing: 0.05em;
                box-shadow: 0 2px 16px 0 #bfa36f1a, 0 1.5px 6px 0 #bfa36f22;
            }
            .result.has-error { border-color: var(--error); }
            .error { color: var(--error); }
            .hidden { display: none !important; }
            .result-note, .result-error {
                font-family: var(--sans);
                font-size: 1rem;
                color: var(--label);
                letter-spacing: 0;
            }
            .result-note { margin-top: 0.5rem; }
            .result-error { font-weight: 600; }

            .section-label {
                font-family: var(--sans);
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.09em;
                text-transform: uppercase;
                color: var(--label);
            }

            .hero-row {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.5rem 1rem;
                margin-top: 0.15rem;
            }
            .hero-value {
                font-family: var(--sans);
                font-size: clamp(2rem, 6vw, 3rem);
                line-height: 1.15;
                font-weight: 800;
                letter-spacing: -0.01em;
                color: var(--ink);
            }
            .amt { white-space: nowrap; }
            .hero-unit, .stat-unit, .tok-unit {
                margin-left: 0.2em;
                font-weight: 700;
                letter-spacing: 0.06em;
            }
            .hero-unit {
                display: inline-block;
                vertical-align: 0.35em;
                padding: 0.2em 0.5em;
                border-radius: 999px;
                background: var(--gold-light);
                font-size: 0.4em;
                line-height: 1.2;
            }
            .hero-sep { font-weight: 400; color: var(--op); }
            .copy-btn {
                display: inline-flex;
                align-items: center;
                gap: 0.4em;
                padding: 0.4rem 0.75rem;
                border: 1px solid var(--gold);
                border-radius: 999px;
                background: #fff;
                font-family: var(--sans);
                font-size: 0.8rem;
                font-weight: 600;
                color: var(--ink);
                letter-spacing: 0;
                transition: background-color 0.15s ease;
            }
            .copy-btn:hover { background: var(--cream-dark); }
            .copy-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
            .copy-btn.is-copied { background: var(--gold-light); border-color: var(--gold-light); }

            .stats {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                margin: 0.85rem 0 0;
                padding: 0;
                list-style: none;
            }
            .stat {
                display: inline-flex;
                align-items: baseline;
                gap: 0.5em;
                padding: 0.3rem 0.75rem;
                border: 1px solid var(--line);
                border-radius: 999px;
                background: #fff;
                font-size: 0.85rem;
                letter-spacing: 0;
            }
            .stat-label { font-family: var(--sans); color: var(--label); }
            .stat-value { font-weight: 700; color: var(--ink); }
            .stat-unit, .tok-unit { font-size: 0.78em; color: var(--unit); }

            #result-histogram:not(:empty), #result-steps:not(:empty) {
                margin-top: 1.1rem;
                padding-top: 1rem;
                border-top: 1px solid var(--line);
            }

            .band-row {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.35rem 0.8rem;
            }
            .band-percentiles {
                font-family: var(--sans);
                font-size: 0.8rem;
                font-weight: 700;
                letter-spacing: 0;
                font-variant-numeric: tabular-nums;
                color: var(--ink);
            }
            .band-presets {
                display: inline-flex;
                flex-wrap: wrap;
                justify-content: flex-end;
                gap: 0.2rem;
                margin-left: auto;
            }
            .band-preset {
                min-height: 1.75rem;
                padding: 0 0.6rem;
                border: 1px solid transparent;
                border-radius: 999px;
                font-family: var(--sans);
                font-size: 0.75rem;
                font-weight: 600;
                letter-spacing: 0;
                color: var(--label);
            }
            .band-preset:hover { border-color: var(--line); background: #fff; }
            .band-preset[aria-pressed="true"] { background: var(--gold-light); color: var(--ink); }
            .band-preset:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
            .band-row:not(.hidden) + #result-summary .hero-row { margin-top: 0.35rem; }

            .dist { margin: 0; }
            .dist-plot {
                position: relative;
                height: 9rem;
                padding-top: 1.5rem;
            }
            .dist-band {
                position: absolute;
                top: 1.5rem;
                bottom: 0;
                background: rgba(138, 100, 32, 0.08);
                pointer-events: none;
            }
            .dist-cols {
                position: relative;
                display: grid;
                grid-template-columns: repeat(var(--bins), minmax(0, 1fr));
                column-gap: 2px;
                align-items: end;
                height: 100%;
                border-bottom: 1px solid var(--axis);
            }
            .dist-col {
                position: relative;
                display: flex;
                align-items: flex-end;
                justify-content: center;
                height: 100%;
            }
            .dist-fill {
                width: 100%;
                max-width: 24px;
                border-radius: 4px 4px 0 0;
                background: var(--tail);
            }
            .dist-col.in-band .dist-fill { background: var(--band); }
            .dist-col:hover .dist-fill { background: var(--ink); }
            .dist-tip, .dist-handle-tip {
                position: absolute;
                bottom: calc(100% + 0.35rem);
                left: 50%;
                z-index: 2;
                display: none;
                flex-direction: column;
                gap: 0.05rem;
                padding: 0.4rem 0.6rem;
                border-radius: 8px;
                background: #fff;
                box-shadow: 0 4px 14px rgba(58, 44, 19, 0.16), 0 0 0 1px var(--line);
                font-family: var(--sans);
                font-size: 0.75rem;
                line-height: 1.35;
                letter-spacing: 0;
                white-space: nowrap;
                color: var(--ink);
                transform: translateX(-50%);
                pointer-events: none;
            }
            .dist-tip strong { font-size: 0.95rem; }
            .dist-tip-muted { color: var(--label); }
            .dist-tip.is-start, .dist-handle-tip.is-start { left: 0; transform: none; }
            .dist-tip.is-end, .dist-handle-tip.is-end { left: auto; right: 0; transform: none; }
            .dist-col:hover .dist-tip { display: flex; }
            .dist-handle-tip { font-weight: 700; }

            .dist-handle {
                position: absolute;
                top: 1.5rem;
                bottom: 0;
                z-index: 3;
                width: 24px;
                margin-left: -12px;
                cursor: ew-resize;
                touch-action: none;
                outline: none;
            }
            .dist-handle::before {
                content: "";
                position: absolute;
                top: 0;
                bottom: 0;
                left: 11px;
                width: 2px;
                background: var(--band);
            }
            .dist-handle::after {
                content: "";
                position: absolute;
                top: 50%;
                left: 50%;
                width: 12px;
                height: 28px;
                border: 2px solid var(--band);
                border-radius: 6px;
                background: #fff;
                box-shadow: 0 1px 4px rgba(58, 44, 19, 0.25);
                transform: translate(-50%, -50%);
                transition: background-color 0.15s ease;
            }
            .dist-handle:hover::after, .dist-handle.is-active::after { background: var(--gold-light); }
            .dist-handle:focus-visible::after { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink); }
            .dist-handle:hover .dist-handle-tip,
            .dist-handle:focus-visible .dist-handle-tip,
            .dist-handle.is-active .dist-handle-tip { display: flex; }
            .is-dragging { cursor: ew-resize; user-select: none; }
            .is-dragging .dist-col:hover .dist-tip { display: none; }
            .dist-mean {
                position: absolute;
                top: 1.15rem;
                bottom: 0;
                width: 2px;
                margin-left: -1px;
                background: var(--ink);
                box-shadow: 0 0 0 1px var(--cream);
                pointer-events: none;
            }
            .dist-mean-label {
                position: absolute;
                bottom: 100%;
                left: 50%;
                padding-bottom: 0.1rem;
                font-family: var(--sans);
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0;
                white-space: nowrap;
                color: var(--ink);
                transform: translateX(-50%);
            }
            .dist-mean-label.is-start { left: 0; transform: none; }
            .dist-mean-label.is-end { left: auto; right: 0; transform: none; }
            .dist-axis {
                position: relative;
                height: 1.5rem;
                font-size: 0.72rem;
                font-variant-numeric: tabular-nums;
                letter-spacing: 0;
                color: var(--label);
            }
            .dist-tick {
                position: absolute;
                top: 0;
                padding-top: 0.35rem;
                white-space: nowrap;
                transform: translateX(-50%);
            }
            .dist-tick::before {
                content: "";
                position: absolute;
                top: 0;
                left: 50%;
                width: 1px;
                height: 0.25rem;
                background: var(--axis);
            }
            .dist-tick.is-start { transform: none; }
            .dist-tick.is-start::before { left: 0; }
            .dist-tick.is-end { transform: translateX(-100%); }
            .dist-tick.is-end::before { left: auto; right: 0; }
            .dist-caption {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.3rem 0.9rem;
                margin-top: 0.4rem;
                font-family: var(--sans);
                font-size: 0.78rem;
                letter-spacing: 0;
                color: var(--label);
            }
            .dist-legend { display: inline-flex; align-items: center; gap: 0.4em; }
            .dist-key { width: 0.7rem; height: 0.7rem; border-radius: 3px; background: var(--band); }
            .dist-key-mean { width: 2px; height: 0.85rem; border-radius: 0; background: var(--ink); }
            .dist-hint { color: var(--label); }
            .dist-hint::before { content: "\00b7"; margin: 0 0.4em 0 0.1em; }
            .dist-caption-note { margin-left: auto; }
            .dist-table {
                margin-top: 0.4rem;
                font-family: var(--sans);
                font-size: 0.8rem;
                letter-spacing: 0;
            }
            .dist-table > summary {
                width: fit-content;
                cursor: pointer;
                color: var(--unit);
                text-decoration: underline;
                text-underline-offset: 2px;
            }
            .dist-table table {
                width: 100%;
                margin-top: 0.5rem;
                border-collapse: collapse;
                font-variant-numeric: tabular-nums;
                color: var(--ink);
            }
            .dist-table th, .dist-table td {
                padding: 0.2rem 0.5rem;
                text-align: right;
                border-bottom: 1px solid var(--line);
            }
            .dist-table th:first-child, .dist-table td:first-child { text-align: left; }
            .dist-table th { font-weight: 700; color: var(--label); }
            .dist-table tr.in-band td { background: rgba(138, 100, 32, 0.07); }

            .steps > summary {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                cursor: pointer;
                list-style: none;
                border-radius: 6px;
            }
            .steps > summary::-webkit-details-marker { display: none; }
            .steps > summary::before {
                content: "";
                width: 0.45rem;
                height: 0.45rem;
                border-right: 2px solid var(--label);
                border-bottom: 2px solid var(--label);
                transform: rotate(-45deg);
                transition: transform 0.2s ease;
            }
            .steps[open] > summary::before { transform: rotate(45deg); }
            .steps > summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
            .steps-count {
                margin-left: auto;
                font-family: var(--sans);
                font-size: 0.75rem;
                color: var(--label);
                letter-spacing: 0;
            }

            .stepper { margin: 0.75rem 0 0; padding: 0; list-style: none; }
            .step {
                position: relative;
                display: grid;
                grid-template-columns: 1.75rem 1fr;
                column-gap: 0.85rem;
                align-items: start;
                padding-bottom: 0.6rem;
            }
            .step:last-child { padding-bottom: 0; }
            .step:not(:last-child)::after {
                content: "";
                position: absolute;
                left: calc(0.875rem - 1px);
                top: 1.75rem;
                bottom: 0;
                width: 2px;
                background: var(--line);
            }
            .step-dot {
                display: grid;
                place-items: center;
                width: 1.75rem;
                height: 1.75rem;
                border: 2px solid var(--gold);
                border-radius: 50%;
                background: #fff;
                font-family: var(--sans);
                font-size: 0.72rem;
                font-weight: 700;
                color: var(--ink);
                letter-spacing: 0;
            }
            .step.is-input .step-dot { border-style: dashed; }
            .step.is-final .step-dot { background: var(--gold-light); border-color: var(--gold-light); font-size: 0.95rem; }
            .step-expr {
                padding-top: 0.12rem;
                font-size: 0.95rem;
                line-height: 1.6;
                letter-spacing: 0.02em;
                overflow-wrap: anywhere;
            }
            .step.is-input .step-expr { color: var(--label); }
            .step.is-final .step-expr { font-weight: 700; }
            .tok-num { white-space: nowrap; }
            .tok-op, .tok-paren { color: var(--op); }
            .tok-keyword { font-style: italic; color: var(--unit); }
            .tok-target { font-size: 0.85em; font-weight: 700; letter-spacing: 0.06em; color: var(--unit); }
            .tok-new {
                padding: 0.05em 0.3em;
                border-radius: 4px;
                background: var(--mark);
                box-shadow: inset 0 0 0 1px rgba(191, 163, 111, 0.55);
                color: var(--ink);
            }

            @media (prefers-reduced-motion: no-preference) {
                .steps.is-entering .step {
                    animation: step-in 0.28s ease-out both;
                    animation-delay: calc(var(--i, 0) * 55ms);
                }
                @keyframes step-in {
                    from { opacity: 0; transform: translateY(4px); }
                }
                .dist.is-entering .dist-fill {
                    transform-origin: bottom;
                    animation: dist-grow 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both;
                    animation-delay: calc(var(--i, 0) * 12ms);
                }
                @keyframes dist-grow {
                    from { transform: scaleY(0); }
                }
            }
            @media (max-width: 520px) {
                .dist-tick.is-alt { display: none; }
                .dist-caption-note { margin-left: 0; }
                .band-presets { width: 100%; margin-left: 0; justify-content: space-between; gap: 0; }
                .band-preset { padding: 0 0.25rem; }
            }

            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <h1>unSure Calculator</h1>

            <div class="input-row">
                <label for="expression" class="sr-only">Expression</label>
                <input
                    type="text"
                    id="expression"
                    placeholder="example: 7 ~ 10 * 17~23 * 1~10eur to pln"
                    aria-describedby="hints"
                    autocomplete="off"
                    spellcheck="false"
                />
                <button id="calculateBtn" type="button" aria-label="Calculate">=</button>
            </div>

            <div id="result-container" class="result hidden">
                <div id="band-row" class="band-row hidden" role="group" aria-labelledby="band-label">
                    <span id="band-label" class="section-label">90% likely range</span>
                    <span id="band-percentiles" class="band-percentiles">P5 ~ P95</span>
                    <span id="band-presets" class="band-presets"></span>
                </div>
                <div id="result-summary"></div>
                <div id="result-histogram"></div>
                <div id="result-steps"></div>
            </div>
            <p id="copy-status" class="sr-only" aria-live="polite"></p>

            <p class="hint" id="hints">
                Use '~' for ranges. Example: <code>4.1~4.3 * 10</code>
                &middot; Currency: <code>120usd + 50eur to pln</code>
            </p>
            <p class="hint" id="rate-status">Loading daily FX rates...</p>
            <p class="hint">
                Source on <a href="https://github.com/PythonicNinja/unsure-calc">GitHub</a>
            </p>
            <noscript><p class="hint">This calculator needs JavaScript enabled.</p></noscript>
        </main>
    </body>
</html>
