<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>unSure Calculator</title>
        <meta
            name="description"
            content="Probabilistic calculator: type ranges with ~ (7~10 * 17~23) or currency expressions (120usd + 50eur to pln) to get exact bounds, a simulated 5%-95% range and a histogram."
        />
        <link rel="canonical" href="https://calc.pythonic.ninja/" />
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23e0b973'/%3E%3Ctext x='32' y='47' font-size='44' font-family='Georgia,serif' text-anchor='middle' fill='%233a2c13'%3E~%3C/text%3E%3C/svg%3E"
        />

        <!-- Self-hosted fonts (OFL, see fonts/): preloaded so they land before first paint -->
        <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/manrope-v20-latin.woff2" />
        <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/dm-serif-display-v17-latin.woff2" />

        <!-- Deferred but render-blocking: the first frame already contains the computed result (no pop-in, LCP = FCP) -->
        <script src="core/calc-core.js" defer blocking="render"></script>
        <script src="main.js" defer blocking="render"></script>

        <style>
            @font-face {
                font-family: "Manrope";
                font-style: normal;
                font-weight: 400 800;
                font-display: swap;
                src: url(fonts/manrope-v20-latin.woff2) format("woff2");
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            @font-face {
                font-family: "DM Serif Display";
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url(fonts/dm-serif-display-v17-latin.woff2) format("woff2");
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            /* Metric-matched local fallbacks (fontTools-derived) so a late font swap does not move anything */
            @font-face {
                font-family: "Manrope Fallback";
                src: local("Arial");
                size-adjust: 100.576%;
                ascent-override: 105.99%;
                descent-override: 29.828%;
                line-gap-override: 0%;
            }
            @font-face {
                font-family: "DM Serif Display Fallback";
                src: local("Georgia");
                size-adjust: 101.266%;
                ascent-override: 102.305%;
                descent-override: 33.081%;
                line-gap-override: 0%;
            }

            :root {
                --gold: #bfa36f;
                --gold-light: #e0b973;
                --cream: #fff6f0;
                --cream-dark: #f7e7ce;
                --ink: #3a2c13;
                --muted: #6b7280;
                --error: #b91c1c;
                --sans: "Manrope", "Manrope Fallback", Arial, sans-serif;
                --serif: "DM Serif Display", "DM Serif Display Fallback", Georgia, serif;
                --mono: "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
                --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            }

            *, *::before, *::after { box-sizing: border-box; }
            html { line-height: 1.5; -webkit-text-size-adjust: 100%; }
            body, h1, p { margin: 0; }
            a { color: inherit; }
            button { background: none; border: 0; font: inherit; color: inherit; cursor: pointer; }
            code {
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
                font-size: 1em;
            }

            body {
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: flex-start;
                padding: clamp(1rem, 6vh, 4rem) 1rem 1rem;
                font-family: var(--sans);
                color: #1f2937;
                letter-spacing: 0.01em;
                background: linear-gradient(135deg, var(--cream-dark) 0%, var(--cream) 100%);
            }
            .card {
                width: 100%;
                max-width: 56rem;
                padding: 1rem;
                background: #fff;
                border-radius: 0.5rem;
                box-shadow: var(--shadow-md);
            }
            h1 {
                font-family: var(--serif);
                font-size: 1.875rem;
                line-height: 2.25rem;
                font-weight: 700;
                color: #374151;
                text-align: center;
                letter-spacing: 0.025em;
                text-shadow: 0 2px 8px var(--cream), 0 1px 0 var(--gold);
                margin-bottom: 1.5rem;
                cursor: pointer;
            }
            .input-row {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                margin-bottom: 1.5rem;
            }
            #expression {
                flex: 1 1 auto;
                min-width: 0;
                padding: 1.15rem 1.5rem;
                border: 2px solid var(--gold);
                border-radius: 10px;
                background: var(--cream);
                font-family: var(--sans);
                font-size: 1.18rem;
                line-height: 1.625;
                font-weight: 500;
                letter-spacing: 0.05em;
                color: var(--ink);
                box-shadow: 0 1.5px 6px 0 rgba(191, 163, 111, 0.08);
            }
            #expression::placeholder { color: var(--muted); opacity: 1; }
            #expression:focus {
                outline: none;
                border-color: var(--gold-light);
                box-shadow: 0 0 0 2px #f2e6d9, 0 1.5px 6px 0 #e0b97333;
            }
            #calculateBtn {
                flex: 0 0 50px;
                padding: 1rem 0;
                background: var(--gold-light);
                color: var(--ink);
                font-family: var(--sans);
                font-weight: 700;
                font-size: 1.25rem;
                line-height: 1.75rem;
                border-radius: 10px 0.75rem 0.75rem 10px;
                box-shadow: var(--shadow-md);
            }
            #calculateBtn:hover { background: var(--gold); }
            #calculateBtn:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 2px; }

            .hint {
                margin-top: 0.5rem;
                font-size: 0.75rem;
                line-height: 1rem;
                min-height: 1rem;
                color: var(--muted);
                text-align: center;
            }
            .result + .hint { margin-top: 1rem; }
            .hint a { color: #7f6127; text-decoration: underline; }
            .hint a:hover { color: var(--gold); }

            .result {
                margin-top: 0;
                padding: 1.5rem 1.2rem 1.2rem;
                min-height: 4em;
                overflow-x: auto;
                border: 2px solid var(--gold);
                border-radius: 10px;
                background: linear-gradient(135deg, var(--cream) 80%, var(--cream-dark) 100%);
                color: var(--ink);
                font-family: var(--mono);
                font-size: 0.875rem;
                line-height: 1.625;
                letter-spacing: 0.05em;
                box-shadow: 0 2px 16px 0 #bfa36f1a, 0 1.5px 6px 0 #bfa36f22;
            }
            .result.has-error { border-color: var(--error); }
            .error { color: var(--error); }
            .hidden { display: none; }
            #result-summary div {
                font-family: var(--sans);
                font-size: 1.11rem;
                color: var(--ink);
            }
            .result-note { margin-top: 0.5rem; }
            .steps { margin-top: 0.25rem; }

            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <h1>unSure Calculator</h1>

            <div class="input-row">
                <label for="expression" class="sr-only">Expression</label>
                <input
                    type="text"
                    id="expression"
                    placeholder="example: 7 ~ 10 * 17~23 * 1~10eur to pln"
                    aria-describedby="hints"
                    autocomplete="off"
                    spellcheck="false"
                />
                <button id="calculateBtn" type="button" aria-label="Calculate">=</button>
            </div>

            <div id="result-container" class="result hidden">
                <div id="result-summary"></div>
                <div id="result-histogram"></div>
            </div>

            <p class="hint" id="hints">
                Use '~' for ranges. Example: <code>4.1~4.3 * 10</code>
                &middot; Currency: <code>120usd + 50eur to pln</code>
            </p>
            <p class="hint" id="rate-status">Loading daily FX rates...</p>
            <p class="hint">
                Source on <a href="https://github.com/PythonicNinja/unsure-calc">GitHub</a>
            </p>
            <noscript><p class="hint">This calculator needs JavaScript enabled.</p></noscript>
        </main>
    </body>
</html>
